# Deployed as a GitHub Pages project site at https://world-wide-jugs.github.io/GlobalWWJugs/
quarkus.http.root-path=/GlobalWWJugs
site.url=https://world-wide-jugs.github.io

# Use {=expr} for Qute value expressions; bare { } stays literal (needed for the map's inline JS).
quarkus.qute.alt-expr-syntax=true
quarkus.qute.strict-rendering=false

# The jugs collection is data only (no per-JUG pages), matching Jekyll's output:false.
site.collections.jugs.hidden=true
site.collections.jugs.layout=page
