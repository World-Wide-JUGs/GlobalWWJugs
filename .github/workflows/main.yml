name: Deploy the site

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the app with the Roq static generator enabled
        run: ./mvnw -B package -Dquarkus.roq.generator.batch=true

      - name: Generate the static site into target/roq
        run: java -jar target/quarkus-app/quarkus-run.jar

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/roq
          allow_empty_commit: true
